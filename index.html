<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أذكار الصباح والمساء</title>
<style>
body{font-family:system-ui,sans-serif;background:#FDF6E3;margin:0;padding:16px}
h1{text-align:center;color:#2D4A2B;margin:10px 0 5px;font-size:26px}
.sub{text-align:center;color:#888;font-size:14px;margin-bottom:18px}
.tabs{display:flex;gap:10px;justify-content:center;margin-bottom:18px}
.tabs button{padding:10px 22px;border:0;border-radius:20px;font-size:16px;background:#EDE6D6;cursor:pointer}
.tabs button.active{background:#2D4A2B;color:white}
.card{background:white;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 6px #0001}
.card h3{margin:0 0 8px;color:#2D4A2B;font-size:17px}
.card p{font-size:18px;line-height:1.9;margin:0;color:#333}
.controls{display:flex;align-items:center;justify-content:center;gap:15px;margin-top:14px}
.controls button{width:42px;height:42px;border-radius:50%;border:0;font-size:22px;background:#F0EAD9;cursor:pointer}
.controls button.plus{background:#2D4A2B;color:white}
.count{font-size:20px;font-weight:bold;min-width:50px;text-align:center}
.done{opacity:.5}
.done h3{text-decoration:line-through}
</style>
</head>
<body>

<h1>أذكار الصباح والمساء</h1>
<p class="sub">اذكر الله يذكرك</p>

<div class="tabs">
<button id="bSabah" class="active" onclick="show('sabah')">أذكار الصباح</button>
<button id="bMasa" onclick="show('masa')">أذكار المساء</button>
</div>

<div id="list"></div>

<script>
const data={
sabah:[
{t:"آية الكرسي",n:1,txt:"اللَّهُ لَا إِلَهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ"},
{t:"سورة الإخلاص",n:3,txt:"قُلْ هُوَ اللَّهُ أَحَدٌ ۞ اللَّهُ الصَّمَدُ ۞ لَمْ يَلِدْ وَلَمْ يُولَدْ ۞ وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ"},
{t:"سورة الفلق",n:3,txt:"قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ۞ مِن شَرِّ مَا خَلَقَ ۞ وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ"},
{t:"سورة الناس",n:3,txt:"قُلْ أَعُوذُ بِرَبِّ النَّاسِ ۞ مَلِكِ النَّاسِ ۞ إِلَهِ النَّاسِ ۞ مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ"},
{t:"أصبحنا وأصبح الملك لله",n:1,txt:"أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ"},
{t:"سيد الاستغفار",n:1,txt:"اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ"},
{t:"سبحان الله وبحمده",n:100,txt:"سُبْحَانَ اللَّهِ وَبِحَمْدِهِ"},
{t:"لا إله إلا الله",n:100,txt:"لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ"},
],
masa:[
{t:"آية الكرسي",n:1,txt:"اللَّهُ لَا إِلَهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ"},
{t:"سورة الإخلاص",n:3,txt:"قُلْ هُوَ اللَّهُ أَحَدٌ ۞ اللَّهُ الصَّمَدُ ۞ لَمْ يَلِدْ وَلَمْ يُولَدْ"},
{t:"سورة الفلق",n:3,txt:"قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ۞ مِن شَرِّ مَا خَلَقَ"},
{t:"سورة الناس",n:3,txt:"قُلْ أَعُوذُ بِرَبِّ النَّاسِ ۞ مَلِكِ النَّاسِ ۞ إِلَهِ النَّاسِ"},
{t:"أمسينا وأمسى الملك لله",n:1,txt:"أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ"},
{t:"سيد الاستغفار",n:1,txt:"اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ"},
{t:"سبحان الله وبحمده",n:100,txt:"سُبْحَانَ اللَّهِ وَبِحَمْدِهِ"},
{t:"أعوذ بكلمات الله التامات",n:3,txt:"أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ"},
]};

let cur='sabah'; let counts={};
function show(type){
cur=type;
document.getElementById('bSabah').className = type=='sabah'?'active':'';
document.getElementById('bMasa').className = type=='masa'?'active':'';
counts={};
let h="";
data[type].forEach((z,i)=>{
counts[i]=z.n;
h+=`<div class="card" id="card${i}"><h3>${z.t}</h3><p>${z.txt}</p><div class="controls"><button onclick="change(${i},-1)">-</button><span class="count" id="c${i}">${z.n}</span><button class="plus" onclick="change(${i},1)">+</button></div></div>`;
});
document.getElementById("list").innerHTML=h;
}
function change(i,d){
counts[i]+=d;
if(counts[i]<0) counts[i]=0;
if(counts[i]>data[cur][i].n) counts[i]=data[cur][i].n;
document.getElementById("c"+i).innerText=counts[i];
if(counts[i]==0) document.getElementById("card"+i).classList.add("done");
else document.getElementById("card"+i).classList.remove("done");
}
show('sabah');
</script>
</body>
</html>
