<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أذكار الصباح والمساء</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap');
body{font-family:'Amiri',serif;background:#F9F3E8;margin:0;padding:0 14px 30px}
.header{background:linear-gradient(135deg,#0F3D2E,#1B5E43);color:#FFD88A;text-align:center;padding:28px 12px 20px;border-radius:0 0 28px 28px;margin:0 -14px 18px}
.header h1{margin:0;font-size:28px;color:white}
.header p{margin:8px 0 0;color:#FFD88A;font-size:16px}
.tabs{display:flex;gap:10px;margin-bottom:16px}
.tabs button{flex:1;padding:13px;border:2px solid #1B5E43;background:white;color:#1B5E43;border-radius:50px;font-size:17px;font-weight:bold}
.tabs button.active{background:#1B5E43;color:white}
.card{background:white;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 4px 14px #0001;border:1px solid #EDE0C5;display:flex;gap:12px;align-items:flex-start}
.card.done{opacity:.55;background:#F0F7F0}
.text{flex:1}
.text h3{margin:0 0 6px;color:#1B5E43;font-size:19px}
.text p{font-size:21px;line-height:2;margin:0;color:#333}
.circle{min-width:62px;height:62px;border-radius:50%;background:#FFF4D6;border:2px solid #E9A426;display:flex;flex-direction:column;align-items:center;justify-content:center}
.circle b{font-size:22px;color:#1B5E43;line-height:1}
.circle span{font-size:11px;color:#888}
.hint{text-align:center;color:#999;font-size:13px;margin:6px}
</style>
</head>
<body>
<div class="header"><h1>✦ أذكار الصباح والمساء ✦</h1><p>ألا بذكر الله تطمئن القلوب</p></div>
<div class="tabs">
<button id="bSabah" class="active" onclick="showSabah()">☀️ الصباح</button>
<button id="bMasa" onclick="showMasa()">🌙 المساء</button>
</div>
<p class="hint">دوسي على أي ذكر عشان ينقص 👇</p>
<div id="list"></div>

<script>
var sabah=[
["آية الكرسي",1,"اللَّهُ لَا إِلَهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ"],
["سورة الإخلاص",3,"قُلْ هُوَ اللَّهُ أَحَدٌ ۞ اللَّهُ الصَّمَدُ ۞ لَمْ يَلِدْ وَلَمْ يُولَدْ"],
["سورة الفلق",3,"قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ۞ مِن شَرِّ مَا خَلَقَ"],
["سورة الناس",3,"قُلْ أَعُوذُ بِرَبِّ النَّاسِ ۞ مَلِكِ النَّاسِ ۞ إِلَهِ النَّاسِ"],
["أصبحنا وأصبح الملك لله",1,"أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ ، وَالْحَمْدُ لِلَّهِ"],
["سيد الاستغفار",1,"اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ ، خَلَقْتَنِي وَأَنَا عَبْدُكَ"],
["سبحان الله وبحمده",100,"سُبْحَانَ اللَّهِ وَبِحَمْدِهِ"],
["لا إله إلا الله",100,"لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ"]
];
var masa=[
["آية الكرسي",1,"اللَّهُ لَا إِلَهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ"],
["سورة الإخلاص",3,"قُلْ هُوَ اللَّهُ أَحَدٌ ۞ اللَّهُ الصَّمَدُ"],
["سورة الفلق",3,"قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ۞ مِن شَرِّ مَا خَلَقَ"],
["سورة الناس",3,"قُلْ أَعُوذُ بِرَبِّ النَّاسِ ۞ مَلِكِ النَّاسِ"],
["أمسينا وأمسى الملك لله",1,"أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ ، وَالْحَمْدُ لِلَّهِ"],
["سيد الاستغفار",1,"اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ"],
["سبحان الله وبحمده",100,"سُبْحَانَ اللَّهِ وَبِحَمْدِهِ"],
["أعوذ بكلمات الله التامات",3,"أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ"]
];
var cur=sabah; var counts=[];
function render(){
var list=document.getElementById("list"); list.innerHTML=""; counts=[];
for(var i=0;i<cur.length;i++){counts[i]=cur[i][1];
var d=document.createElement("div"); d.className="card"; d.id="card"+i;
d.onclick=(function(idx){return function(){tap(idx)}})(i);
d.innerHTML="<div class='text'><h3>"+cur[i][0]+"</h3><p>"+cur[i][2]+"</p></div><div class='circle'><b id='c"+i+"'>"+cur[i][1]+"</b><span>متبقي</span></div>";
list.appendChild(d);
}
}
function tap(i){if(counts[i]>0){counts[i]--; document.getElementById("c"+i).innerText=counts[i]; if(counts[i]==0) document.getElementById("card"+i).classList.add("done");}}
function showSabah(){cur=sabah; document.getElementById("bSabah").className="active"; document.getElementById("bMasa").className=""; render();}
function showMasa(){cur=masa; document.getElementById("bMasa").className="active"; document.getElementById("bSabah").className=""; render();}
render();
</script>
</body>
</html>
