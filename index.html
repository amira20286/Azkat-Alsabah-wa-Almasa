["آية الكرسي",1,"اللَّهُ لَا إِلَهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَنْ ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ","أُجير من الجن حتى يمسي"],
["الإخلاص",3,"قُلْ هُوَ اللَّهُ أَحَدٌ ۞ اللَّهُ الصَّمَدُ ۞ لَمْ يَلِدْ وَلَمْ يُولَدْ ۞ وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ","تكفيك من كل شيء"],
["الفلق",3,"قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ۞ مِن شَرِّ مَا خَلَقَ ۞ وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ ۞ وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ۞ وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ","تحفظك من الشر والحسد"],
["الناس",3,"قُلْ أَعُوذُ بِرَبِّ النَّاسِ ۞ مَلِكِ النَّاسِ ۞ إِلَهِ النَّاسِ ۞ مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ۞ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ۞ مِنَ الْجِنَّةِ وَالنَّاسِ","تحفظك من الوساوس"],
["أصبحنا وأصبح الملك لله",1,"أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذَا الْيَوْمِ وَخَيْرَ مَا بَعْدَهُ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَذَا الْيَوْمِ وَشَرِّ مَا بَعْدَهُ","تجديد التوحيد"],
["سيد الاستغفار",1,"اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ لَكَ بِذَنْبِي فَاغْفِرْ لِي، فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ","من قالها موقنا دخل الجنة"],
["اللهم بك أصبحنا",1,"اللَّهُمَّ بِكَ أَصْبَحْنَا، وَبِكَ أَمْسَيْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ النُّشُورُ","حياتنا بيد الله"],

["اللهم عالم الغيب",1,"اللَّهُمَّ عَالِمَ الْغَيْبِ وَالشَّهَادَةِ، فَاطِرَ السَّمَاوَاتِ وَالْأَرْضِ، رَبَّ كُلِّ شَيْءٍ وَمَلِيكَهُ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا أَنْتَ، أَعُوذُ بِكَ مِنْ شَرِّ نَفْسِي وَمِنْ شَرِّ الشَّيْطَانِ وَشِرْكِهِ","تحفظك من شر الشيطان"],
["بسم الله الذي لا يضر",3,"بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ","لم تضره شيء"],
["رضيت بالله ربا",3,"رَضِيتُ بِاللَّهِ رَبًّا، وَبِالْإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ نَبِيًّا","يرضيه الله يوم القيامة"],
["يا حي يا قيوم",1,"يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغِيثُ، أَصْلِحْ لِي شَأْنِي كُلَّهُ، وَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ","تفويض الأمر لله"],
["اللهم إني أصبحت أشهدك",4,"اللَّهُمَّ إِنِّي أَصْبَحْتُ أُشْهِدُكَ، وَأُشْهِدُ حَمَلَةَ عَرْشِكَ، وَمَلَائِكَتَكَ، وَجَمِيعَ خَلْقِكَ، أَنَّكَ أَنْتَ اللَّهُ لَا إِلَهَ إِلَّا أَنْتَ وَحْدَكَ لَا شَرِيكَ لَكَ، وَأَنَّ مُحَمَّدًا عَبْدُكَ وَرَسُولُكَ","أعتقه الله من النار"],
["حسبي الله",7,"حَسْبِيَ اللَّهُ لَا إِلَهَ إِلَّا هُوَ، عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ","كفاه الله ما أهمه"],
["أعوذ بكلمات الله التامات",3,"أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ","لم تضره شيء"],
["سبحان الله وبحمده",100,"سُبْحَانَ اللَّهِ وَبِحَمْدِهِ","حُطت خطاياه"],
["لا إله إلا الله وحده",100,"لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ","حرز من الشيطان"],
["سبحان الله عدد خلقه",3,"سُبْحَانَ اللَّهِ وَبِحَمْدِهِ عَدَدَ خَلْقِهِ، وَرِضَا نَفْسِهِ، وَزِنَةَ عَرْشِهِ، وَمِدَادَ كَلِمَاتِهِ","تعدل ساعات من الذكر"],
["اللهم صل على محمد",10,"اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى نَبِيِّنَا مُحَمَّدٍ","تدركه الشفاعة"],

["اللهم صل على محمد",10,"اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى نَبِيِّنَا مُحَمَّدٍ","تدركه الشفاعة"]
];
var cur=S,counts=[];
function render(){var L=document.getElementById("list");L.innerHTML="";counts=[];for(var i=0;i<cur.length;i++){counts[i]=cur[i][1];var d=document.createElement("div");d.className="card";d.id="c"+i;d.innerHTML="<h3>"+cur[i][0]+"</h3><p>"+cur[i][2]+"</p><div class='fadl'>⭐ "+cur[i][3]+"</div><div style='text-align:center;font-size:24px;color:#2D4A2B;font-weight:bold;margin-top:8px' id='n"+i+"'>"+cur[i][1]+"</div><button class='greenBtn' id='b"+i+"' onclick='down("+i+")'>✓ اضغطي هنا</button>";L.appendChild(d);}}
function down(i){if(counts[i]>0){counts[i]--;document.getElementById("n"+i).innerText=counts[i];if(counts[i]==0){document.getElementById("c"+i).classList.add("done");document.getElementById("b"+i).innerText="✓ تم";}}}
var T=[{n:"سبحان الله",v:0},{n:"الحمد لله",v:0},{n:"الله أكبر",v:0},{n:"استغفر الله",v:0},{n:"لا إله إلا الله",v:0}];
try{var saved=JSON.parse(localStorage.getItem("T")||"null");if(saved&&saved.length)T=saved;}catch(e){}
function renderT(){var e=document.getElementById("tasb");var h="<h2 style='text-align:center'>📿 المسبحة</h2>";for(var i=0;i<T.length;i++){h+="<div class='card'><div style='text-align:center;font-weight:bold;font-size:20px'>"+T[i].n+"</div><div class='tasbNum'>"+T[i].v+"</div><div style='display:flex;gap:8px'><button class='greenBtn' style='margin:0' onclick='tup("+i+")'>+ سبحي</button><button style='padding:14px;border:0;border-radius:14px' onclick='tdown("+i+")'>-</button></div></div>";}h+="<button class='greenBtn' onclick='tadd()'>+ إضافة عداد</button>";e.innerHTML=h;}
function tup(i){T[i].v++;save();renderT();}
function tdown(i){T[i].v=Math.max(0,T[i].v-1);save();renderT();}
function tadd(){var n=prompt("اسم الذكر؟","ذكر جديد");if(n){T.push({n:n,v:0});save();renderT();}}
function save(){try{localStorage.setItem("T",JSON.stringify(T));}catch(e){}}
function showTab(t){document.getElementById("bS").className=t=="s"?"active":"";document.getElementById("bM").className=t=="m"?"active":"";document.getElementById("bT").className=t=="t"?"active":"";if(t=="t"){document.getElementById("list").style.display="none";document.getElementById("tasb").style.display="block";renderT();}else{document.getElementById("list").style.display="block";document.getElementById("tasb").style.display="none";cur=t=="s"?S:M;render();}}
render();
</script></body></html>
