<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<title>أذكار الصباح والمساء</title>
<style>
body{font-family:system-ui,sans-serif;background:#FDF6E3;margin:0;padding:16px}

.sub{text-align:center;color:#888;font-size:14px;margin-bottom:18px}
.tabs{display:flex;gap:8px;justify-content:center;margin-bottom:18px}

.tabs button.active{background:#2D4A2B;color:white}
.card{background:white;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 6px #0001;transition:.3s}
.card h3{margin:0 0 8px;color:#2D4A2B;font-size:18px}
.card p{font-size:19px;line-height:2.1;margin:0;color:#222}

.countRow{text-align:center;margin-top:14px}
.countRow .num{font-size:26px;font-weight:bold;color:#2D4A2B}
.countRow .label{font-size:13px;color:#999}
.greenBtn{width:100%;margin-top:12px;padding:15px;border:0;border-radius:14px;background:#2D4A2B;color:white;font-size:19px;font-weight:bold}
.undoBtn{width:100%;margin-top:8px;padding:8px;border:0;background:transparent;color:#999;font-size:13px}
.done{opacity:.45;background:#F0F7F0}
.done .greenBtn{background:#A8C0A8}
/* المسبحة */
.tasbTop{background:white;border-radius:14px;padding:14px;text-align:center;margin-bottom:14px}
.tasbTop h2{margin:0;color:#2D4A2B}

.tasbCard input{width:100%;border:0;border-bottom:1px solid #eee;text-align:center;font-size:19px;font-weight:bold;color:#2D4A2B;padding:8px;outline:none;background:transparent}
.tasbNum{text-align:center;font-size:38px;font-weight:bold;color:#2D4A2B;margin:10px 0 4px}
.tasbRow{display:flex;gap:10px}
.tasbRow button{flex:1;padding:14px;border:0;border-radius:12px;font-size:18px;font-weight:bold}
.btnPlus{background:#2D4A2B;color:white}
.btnMinus{background:#F0EAD9;color:#555}
.btnDel{background:#FFEAEA;color:#C00;flex:0 0 52px !important}
.addBtn{width:100%;padding:15px;border:2px dashed #2D4A2B;background:#fff;border-radius:14px;color:#2D4A2B;font-size:17px;font-weight:bold;margin-top:6px}
.resetAll{width:100%;padding:10px;border:0;background:transparent;color:#999;font-size:13px;margin-top:8px}
</style>
</head>

<div id="list"></div>
