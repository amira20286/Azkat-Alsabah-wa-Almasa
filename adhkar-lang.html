var cur=S,curName="أذكار الصباح";
var lang="ar";
var counts={};
function GA(d){
return d.a||d.ar||d.arabic||d[0]||"";
}
function GT(d){
return d.t||d.tr||d.trans||d[1]||"";
}
function GE(d){
return d.e||d.en||d.english||d[2]||"";
}
function GD(d){
return d.g||d.de||d.german||d[3]||"";
}
function T(d){
if(lang=="ar")return GA(d);
if(lang=="tr")return GT(d);
if(lang=="en")return GE(d);
return GD(d);
}
function NT(d){
if(lang=="ar")return d.na||d.note_ar||d[4]||"";
if(lang=="en")return d.ne||d.note_en||d[5]||"";
return d.ng||d.note_de||d[6]||"";
}
function GC(d){
return d.n||d.count||d.c||d[7]||1;
}
function show(){
var box=document.getElementById("box");
if(!box){
box=document.createElement("div");
box.id="box";
document.body.appendChild(box);
}
var h="<h2 style='text-align:center'>"+curName+"</h2>";
var out=h;
for(var i=0;i<cur.length;i++){
var d=cur[i];
var key=curName+i;
var c=counts[key]||0;
out+="<div style='border:1px solid #ddd;border-radius:14px;padding:14px;margin:10px;background:#fff'>";
out+="<div dir='rtl' style='font-size:22px;line-height:2;text-align:right'>"+GA(d)+"</div>";
out+="<div style='color:#555;margin-top:8px'>"+T(d)+"</div>";
out+="<div style='color:#888;font-size:13px;margin-top:6px'>"+NT(d)+"</div>";
out+="<div style='margin-top:10px'><button onclick='doCount(\""+key+"\","+GC( d )+",this)'>"+c+" / "+GC( d )+" - اضغط للتسبيح</button></div>";
out+="</div>";
}
box.innerHTML=out;
}
function doCount(k,n,btn){
var c=(counts[k]||0)+1;
if(c>n)c=0;
counts[k]=c;
btn.textContent=c+" / "+n+" - اضغط للتسبيح";
}
function setList(list,name){
cur=list;curName=name;
counts={};
show();
window.scrollTo(0,0);
}
function setLang(l){
lang=l;
show();
}

"<button onclick='setLang(\"en\")'>English</button> "+
"<button onclick='setLang(\"de\")'>Deutsch</button>";
document.body.insertBefore(nav,document.body.firstChild);
show();
