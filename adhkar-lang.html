<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أذكاري</title>
<style>
body{font-family:Arial;background:#f6f1e7;margin:0;padding:10px}

.ar{font-size:22px;line-height:1.9;text-align:center}
.tr{font-size:15px;color:#666;text-align:center;margin-top:8px;direction:ltr}
.en,.de{font-size:14px;color:#444;text-align:center;margin-top:6px;direction:ltr}

</style>
</head>

</div>

<button id="bT" onclick="showTab('t')">المسبحة</button>
</div>
