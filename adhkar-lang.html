<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>أذكار - Adhkar</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
body{font-family:'Amiri',serif;background:#FDF6E3;margin:0;padding:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.langs{display:flex;gap:6px}
.langs button{font-size:26px;background:#EDE6D6;border:0;border-radius:12px;padding:6px 10px}
.langs button.active{background:#2D4A2B}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tabs button{flex:1;padding:10px;border:0;border-radius:20px;background:#EDE6D6;font-size:17px}
.tabs button.active{background:#2D4A2B;color:#fff}
.card{background:#fff;border-radius:14px;padding:14px;margin:12px 0}
.card p{font-size:24px;line-height:2;text-align:center}
.trans{font-size:19px;line-height:1.7;color:#555;direction:ltr;text-align:center;font-family:Arial}
.meaning{font-size:18px;line-height:1.7;color:#333;direction:ltr;text-align:center;font-family:Arial}
.fadl{background:#FFF8E1;padding:10px;border-radius:10px;font-size:17px;line-height:1.8;text-align:center}
.greenBtn{width:100%;padding:14px;border:0;border-radius:14px;background:#2D4A2B;color:#fff;font-size:18px;font-weight:bold;margin-top:10px}
</style></head>
<body>

<div class="top">
<div><h1 style="margin:0;color:#2D4A2B;font-size:22px">أذكار الصباح والمساء</h1></div>
<div class="langs">
<button id="l-ar" class="active" onclick="setLang('ar')">🇸🇦</button>
<button id="l-en" onclick="setLang('en')">🇬🇧</button>
<button id="l-de" onclick="setLang('de')">🇩🇪</button>
</div>
</div>

<label style="display:flex;gap:8px;align-items:center;justify-content:center;margin:10px 0;font-size:17px">
<input type="checkbox" id="showTr" checked onchange="render()"> عED إظهار النطق بالحروف اللاتينية
</label>

<div class="tabs">
<button id="bS" class="active" onclick="showTab('s')">☀️ الصباح</button>
<button id="bM" onclick="showTab('m')">🌙 المساء</button>
<button id="bN" onclick="showTab('n')">🛏️ النوم</button>
<button id="bP" onclick="showTab('p')">🕌 بعد الصلاة</button>
</div>

<div id="list"></div>

<script>
var LANG='ar';
var S=[
{
ar:"اللَّهُ لَا إِلَهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ",
tr:"Allahu la ilaha illa huwa al-hayyu al-qayyum, la ta'khudhuhu sinatun wa la nawm",
en:"Allah, there is no god but He, the Ever-Living, the Sustainer. Neither drowsiness nor sleep overtakes Him.",
de:"Allah, es gibt keinen Gott außer Ihm, dem Lebendigen, dem Beständigen. Weder Schlummer noch Schlaf überkommt Ihn.",
fadl_ar:"من قالها حين يصبح أُجير من الجن حتى يمسي",
fadl_en:"Whoever says it in the morning is protected from the jinn until evening.",
fadl_de:"Wer es am Morgen sagt, ist bis zum Abend vor den Dschinn geschützt.",
count:1
}
];
var M=S, N=S, P=S;
var cur=S, counts=[];

function setLang(l){LANG=l;
document.getElementById('l-ar').className=l=='ar'?'active':'';
document.getElementById('l-en').className=l=='en'?'active':'';
document.getElementById('l-de').className=l=='de'?'active':'';
document.documentElement.dir = l=='ar'?'rtl':'ltr';
render();
}
function render(){
var L=document.getElementById("list");L.innerHTML="";counts=[];
for(var i=0;i<cur.length;i++){
counts[i]=cur[i].count;
var d=document.createElement("div");d.className="card";
var showTr=document.getElementById("showTr").checked;
var main = LANG=='ar' ? cur[i].ar : (LANG=='en' ? cur[i].en : cur[i].de);
var fadl = LANG=='ar' ? cur[i].fadl_ar : (LANG=='en' ? cur[i].fadl_en : cur[i].fadl_de);
var trHtml = (LANG!='ar' && showTr) ? "<div class='trans'>"+cur[i].tr+"</div>" : "";
var arHtml = LANG!='ar' ? "<div style='font-size:24px;line-height:2;text-align:center'>"+cur[i].ar+"</div>" : "";
d.innerHTML="<p>"+main+"</p>"+trHtml+arHtml+"<div class='fadl'>⭐ "+fadl+"</div><div style='text-align:center;font-size:24px;color:#2D4A2B;font-weight:bold;margin-top:8px'>"+cur[i].count+"</div><button class='greenBtn' onclick='down("+i+")'>✓</button>";
L.appendChild(d);
}}
function down(i){if(counts[i]>0){counts[i]--;render();}}
function showTab(t){document.getElementById("bS").className=t=="s"?"active":"";document.getElementById("bM").className=t=="m"?"active":"";document.getElementById("bN").className=t=="n"?"active":"";document.getElementById("bP").className=t=="p"?"active":"";cur=t=="s"?S:t=="m"?M:t=="n"?N:P;render();}
render();
</script></body></html>
