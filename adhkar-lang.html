<script>
var LANG='ar';
function D(ar,tr,en,de,fadl_ar,fadl_en,fadl_de,count){return {ar:ar,tr:tr,en:en,de:de,fadl_ar:fadl_ar,fadl_en:fadl_en,fadl_de:fadl_de,count:count}}
var AYAT=D("اللَّهُ لَا إِلَهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَنْ ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ","Allahu la ilaha illa huwa al-hayyu al-qayyum, la ta'khudhuhu sinatun wa la nawm. Lahu ma fi as-samawati wa ma fi al-ard. Man dha alladhi yashfa'u 'indahu illa bi-idhnih. Ya'lamu ma bayna aydihim wa ma khalfahum, wa la yuhituna bi-shay'in min 'ilmihi illa bi-ma sha'. Wasi'a kursiyyuhu as-samawati wa al-ard, wa la ya'uduhu hifzuhuma, wa huwa al-'aliyyu al-'azim.","Allah, there is no god but He, the Ever-Living, the Sustainer. Neither drowsiness nor sleep overtakes Him. To Him belongs all in the heavens and earth. Who can intercede with Him except by His permission? He knows what is before them and behind them, and they encompass nothing of His knowledge except what He wills. His Kursi extends over heavens and earth, and guarding them does not tire Him. He is the Most High, the Most Great.","Allah, es gibt keinen Gott außer Ihm, dem Lebendigen, dem Beständigen. Weder Schlummer noch Schlaf überkommt Ihn. Ihm gehört alles in den Himmeln und auf der Erde. Wer kann bei Ihm Fürsprache einlegen außer mit Seiner Erlaubnis? Er weiß, was vor ihnen und hinter ihnen ist, und sie umfassen nichts von Seinem Wissen außer was Er will. Sein Thron umfasst Himmel und Erde, und es ermüdet Ihn nicht, sie zu bewahren. Er ist der Höchste, der Gewaltige.","من قالها حين يصبح أُجير من الجن حتى يمسي","Whoever says it in the morning is protected from the jinn until evening.","Wer es am Morgen sagt, ist bis zum Abend vor den Dschinn geschützt.",1);
var IKHLAS=D("بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ قُلْ هُوَ اللَّهُ أَحَدٌ ﴿١﴾ اللَّهُ الصَّمَدُ ﴿٢﴾ لَمْ يَلِدْ وَلَمْ يُولَدْ ﴿٣﴾ وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ ﴿٤﴾","Bismillahir-rahmanir-rahim. Qul huwa Allahu ahad. Allahu as-samad. Lam yalid wa lam yulad. Wa lam yakun lahu kufuwan ahad.","In the name of Allah, the Most Gracious, the Most Merciful. Say: He is Allah, the One. Allah, the Eternal Refuge. He neither begets nor is born. And there is none comparable to Him.","Im Namen Allahs, des Allerbarmers, des Barmherzigen. Sprich: Er ist Allah, der Eine. Allah, der Ewige. Er zeugt nicht und wurde nicht gezeugt. Und niemand ist Ihm gleich.","تكفي من كل شيء مع المعوذتين","Sufficient for everything with the other two Surahs.","Mit den beiden anderen Suren ausreichend für alles.",3);
var FALAQ=D("بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ﴿١﴾ مِن شَرِّ مَا خَلَقَ ﴿٢﴾ وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ ﴿٣﴾ وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ﴿٤﴾ وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ ﴿٥﴾","Bismillahir-rahmanir-rahim. Qul a'udhu bi-rabbil-falaq. Min sharri ma khalaq. Wa min sharri ghasiqin idha waqab. Wa min sharrin-naffathati fil-'uqad. Wa min sharri hasidin idha hasad.","Say: I seek refuge in the Lord of daybreak. From the evil of what He created. And from the evil of darkness when it settles. And from the evil of those who blow on knots. And from the evil of an envier when he envies.","Sprich: Ich suche Zuflucht beim Herrn der Morgendämmerung. Vor dem Übel dessen, was Er erschaffen hat. Und vor dem Übel der Finsternis, wenn sie hereinbricht. Und vor dem Übel derer, die auf Knoten blasen. Und vor dem Übel eines Neiders, wenn er neidet.","تكفي من كل شيء","Sufficient for everything.","Ausreichend für alles.",3);
var NAS=D("بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ قُلْ أَعُوذُ بِرَبِّ النَّاسِ ﴿١﴾ مَلِكِ النَّاسِ ﴿٢﴾ إِلَهِ النَّاسِ ﴿٣﴾ مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ﴿٤﴾ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ﴿٥﴾ مِنَ الْجِنَّةِ وَالنَّاسِ ﴿٦﴾","Bismillahir-rahmanir-rahim. Qul a'udhu bi-rabbin-nas. Malikin-nas. Ilahin-nas. Min sharril-waswasil-khannas. Alladhi yuwaswisu fi sudurin-nas. Minal-jinnati wan-nas.","Say: I seek refuge in the Lord of mankind. The King of mankind. The God of mankind. From the evil of the whisperer who withdraws. Who whispers in the breasts of mankind. From among jinn and mankind.","Sprich: Ich suche Zuflucht beim Herrn der Menschen. Dem König der Menschen. Dem Gott der Menschen. Vor dem Übel des Einflüsterers, der sich zurückzieht. Der in die Brüste der Menschen einflüstert. Von den Dschinn und den Menschen.","ما تعوذ متعوذ بمثلها","No one seeks refuge with anything like them.","Niemand sucht Zuflucht mit etwas wie ihnen.",3);
var S=[AYAT,IKHLAS,FALAQ,NAS,
D("أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذَا الْيَوْمِ وَخَيْرَ مَا بَعْدَهُ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَذَا الْيَوْمِ وَشَرِّ مَا بَعْدَهُ","Asbahna wa asbaha al-mulku lillah, wal-hamdu lillah, la ilaha illallahu wahdahu la sharika lah, lahul-mulku wa lahul-hamdu wa huwa 'ala kulli shay'in qadir. Rabbi as'aluka khayra ma fi hadha al-yawm wa khayra ma ba'dah, wa a'udhu bika min sharri ma fi hadha al-yawm wa sharri ma ba'dah.","We have entered the morning and the whole kingdom belongs to Allah. All praise is for Allah. There is no god but Allah alone, without partner. To Him belongs dominion and praise, and He is able to do all things. My Lord, I ask You for the good of this day and the good after it, and I seek refuge in You from the evil of this day and the evil after it.","Wir sind in den Morgen eingetreten und das ganze Königreich gehört Allah. Alles Lob gehört Allah. Es gibt keinen Gott außer Allah allein, ohne Partner. Ihm gehört die Herrschaft und das Lob, und Er ist zu allem fähig. Mein Herr, ich bitte Dich um das Gute dieses Tages und das Gute danach, und ich suche Zuflucht bei Dir vor dem Übel dieses Tages und dem Übel danach.","كان النبي ﷺ يقوله إذا أصبح","The Prophet ﷺ used to say it in the morning.","Der Prophet ﷺ sagte es am Morgen.",1),
D("اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ لَكَ بِذَنْبِي فَاغْفِرْ لِي، فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ","Allahumma anta rabbi, la ilaha illa ant, khalaqtani wa ana 'abduk, wa ana 'ala 'ahdika wa wa'dika ma astata't, a'udhu bika min sharri ma sana't, abu'u laka bi-ni'matika 'alayy, wa abu'u laka bi-dhanbi faghfir li, fa-innahu la yaghfiru adh-dhunuba illa ant.","O Allah, You are my Lord, there is no god but You. You created me and I am Your servant, and I am upon Your covenant and promise as much as I can. I seek refuge in You from the evil of what I have done. I acknowledge Your blessing upon me, and I acknowledge my sin, so forgive me, for none forgives sins except You.","O Allah, Du bist mein Herr, es gibt keinen Gott außer Dir. Du hast mich erschaffen und ich bin Dein Diener, und ich halte Deinen Bund und Dein Versprechen, so gut ich kann. Ich suche Zuflucht bei Dir vor dem Übel dessen, was ich getan habe. Ich erkenne Deine Gunst an mir an, und ich erkenne meine Sünde an, so vergib mir, denn niemand vergibt Sünden außer Dir.","من قالها موقناً بها فمات من يومه دخل الجنة","Whoever says it with certainty and dies that day enters Paradise.","Wer es mit Überzeugung sagt und an diesem Tag stirbt, tritt ins Paradies ein.",1),
D("اللَّهُمَّ بِكَ أَصْبَحْنَا، وَبِكَ أَمْسَيْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ النُّشُورُ","Allahumma bika asbahna, wa bika amsayna, wa bika nahya, wa bika namut, wa ilayka an-nushur.","O Allah, by You we enter the morning, by You we enter the evening, by You we live, by You we die, and to You is the resurrection.","O Allah, durch Dich treten wir in den Morgen ein, durch Dich in den Abend, durch Dich leben wir, durch Dich sterben wir, und zu Dir ist die Auferstehung.","كان النبي ﷺ يقوله إذا أصبح","The Prophet ﷺ used to say it in the morning.","Der Prophet ﷺ sagte es am Morgen.",1),
D("اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ، اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي دِينِي وَدُنْيَايَ وَأَهْلِي وَمَالِي، اللَّهُمَّ اسْتُرْ عَوْرَاتِي وَآمِنْ رَوْعَاتِي","Allahumma inni as'aluka al-'afwa wal-'afiyah fi ad-dunya wal-akhirah, Allahumma inni as'aluka al-'afwa wal-'afiyah fi dini wa dunyaya wa ahli wa mali, Allahumma ustur 'awrati wa amin raw'ati.","O Allah, I ask You for pardon and well-being in this world and the Hereafter. O Allah, I ask You for pardon and well-being in my religion, my worldly life, my family and my wealth. O Allah, cover my faults and calm my fears.","O Allah, ich bitte Dich um Vergebung und Wohlbefinden in dieser Welt und im Jenseits. O Allah, ich bitte Dich um Vergebung und Wohlbefinden in meiner Religion, meinem weltlichen Leben, meiner Familie und meinem Besitz. O Allah, bedecke meine Fehler und beruhige meine Ängste.","لم يكن النبي ﷺ يدعها","The Prophet ﷺ never left these supplications.","Der Prophet ﷺ ließ diese Bittgebete nie aus.",1),
D("بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ","Bismillahilladhi la yadurru ma'a ismihi shay'un fil-ardi wa la fis-sama'i wa huwa as-sami'ul-'alim.","In the name of Allah, with whose name nothing on earth or in heaven can cause harm, and He is the All-Hearing, All-Knowing.","Im Namen Allahs, mit dessen Namen nichts auf der Erde oder im Himmel schaden kann, und Er ist der Allhörende, der Allwissende.","من قالها ثلاثاً لم تضره فجأة بلاء","Whoever says it three times will not be harmed by sudden affliction.","Wer es dreimal sagt, dem schadet kein plötzliches Unglück.",3),
D("رَضِيتُ بِاللَّهِ رَبًّا، وَبِالْإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ نَبِيًّا","Raditu billahi rabban, wa bil-islami dinan, wa bi-Muhammadin nabiyya.","I am pleased with Allah as Lord, with Islam as religion, and with Muhammad as Prophet.","Ich bin zufrieden mit Allah als Herrn, mit dem Islam als Religion und mit Muhammad als Propheten.","كان حقاً على الله أن يرضيه يوم القيامة","Allah will surely please him on the Day of Resurrection.","Allah wird ihn am Tag der Auferstehung gewiss zufriedenstellen.",3),
D("يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغِيثُ، أَصْلِحْ لِي شَأْنِي كُلَّهُ، وَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ","Ya hayyu ya qayyum, bi-rahmatika astaghith, aslih li sha'ni kullah, wa la takilni ila nafsi tarfata 'ayn.","O Ever-Living, O Sustainer, by Your mercy I seek help. Set right all my affairs, and do not leave me to myself for even the blink of an eye.","O Lebendiger, O Beständiger, durch Deine Barmherzigkeit suche ich Hilfe. Ordne all meine Angelegenheiten, und überlasse mich nicht mir selbst, auch nicht für einen Augenblick.","وصية النبي ﷺ لفاطمة","The Prophet's ﷺ advice to Fatimah.","Der Rat des Propheten ﷺ an Fatimah.",1),
D("سُبْحَانَ اللَّهِ وَبِحَمْدِهِ عَدَدَ خَلْقِهِ وَرِضَا نَفْسِهِ وَزِنَةَ عَرْشِهِ وَمِدَادَ كَلِمَاتِهِ","Subhanallahi wa bi-hamdihi 'adada khalqihi wa rida nafsihi wa zinata 'arshihi wa midada kalimatih.","Glory be to Allah and praise be to Him, as many times as the number of His creation, as much as pleases Him, as much as the weight of His Throne, and as much as the ink of His words.","Gepriesen sei Allah und Lob sei Ihm, so oft wie die Zahl Seiner Schöpfung, so viel wie es Ihm gefällt, so viel wie das Gewicht Seines Thrones und so viel wie die Tinte Seiner Worte.","من قالها ثلاثاً كُتبت له أضعافاً مضاعفة","Whoever says it three times gets multiplied reward.","Wer es dreimal sagt, erhält vielfachen Lohn.",3),
D("اللَّهُمَّ إِنِّي أَصْبَحْتُ أُشْهِدُكَ، وَأُشْهِدُ حَمَلَةَ عَرْشِكَ، وَمَلَائِكَتَكَ، وَجَمِيعَ خَلْقِكَ، أَنَّكَ أَنْتَ اللَّهُ لَا إِلَهَ إِلَّا أَنْتَ وَحْدَكَ لَا شَرِيكَ لَكَ، وَأَنَّ مُحَمَّدًا عَبْدُكَ وَرَسُولُكَ","Allahumma inni asbahtu ush-hiduk, wa ush-hidu hamalata 'arshik, wa mala'ikatak, wa jami'a khalqik, annaka anta Allahu la ilaha illa anta wahdaka la sharika lak, wa anna Muhammadan 'abduka wa rasuluk.","O Allah, I have entered the morning and I call You to witness, and I call the bearers of Your Throne, Your angels and all Your creation to witness, that You are Allah, there is no god but You alone, without partner, and that Muhammad is Your servant and Messenger.","O Allah, ich bin in den Morgen eingetreten und ich rufe Dich zum Zeugen, und ich rufe die Träger Deines Thrones, Deine Engel und alle Deine Schöpfung zum Zeugen, dass Du Allah bist, es gibt keinen Gott außer Dir allein, ohne Partner, und dass Muhammad Dein Diener und Gesandter ist.","من قالها أربعاً أعتقه الله من النار","Whoever says it four times, Allah frees him from Hellfire.","Wer es viermal sagt, den befreit Allah vom Höllenfeuer.",4),
D("أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ رَبِّ الْعَالَمِينَ، اللَّهُمَّ إِنِّي أَسْأَلُكَ خَيْرَ هَذَا الْيَوْمِ فَتْحَهُ وَنَصْرَهُ وَنُورَهُ وَبَرَكَتَهُ وَهُدَاهُ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِيهِ وَشَرِّ مَا بَعْدَهُ","Asbahna wa asbaha al-mulku lillahi rabbil-'alamin, Allahumma inni as'aluka khayra hadha al-yawm, fathahu wa nasrahu wa nurahu wa barakatahu wa hudah, wa a'udhu bika min sharri ma fihi wa sharri ma ba'dah.","We have entered the morning and the kingdom belongs to Allah, Lord of the worlds. O Allah, I ask You for the good of this day: its opening, its victory, its light, its blessing and its guidance. And I seek refuge in You from its evil and the evil after it.","Wir sind in den Morgen eingetreten und das Königreich gehört Allah, dem Herrn der Welten. O Allah, ich bitte Dich um das Gute dieses Tages: seine Öffnung, seinen Sieg, sein Licht, seinen Segen und seine Führung. Und ich suche Zuflucht bei Dir vor seinem Übel und dem Übel danach.","كان النبي ﷺ يقوله إذا أصبح","The Prophet ﷺ used to say it in the morning.","Der Prophet ﷺ sagte es am Morgen.",1),
D("اللَّهُمَّ عَافِنِي فِي بَدَنِي، اللَّهُمَّ عَافِنِي فِي سَمْعِي، اللَّهُمَّ عَافِنِي فِي بَصَرِي، لَا إِلَهَ إِلَّا أَنْتَ","Allahumma 'afini fi badani, Allahumma 'afini fi sam'i, Allahumma 'afini fi basari, la ilaha illa ant.","O Allah, grant me well-being in my body. O Allah, grant me well-being in my hearing. O Allah, grant me well-being in my sight. There is no god but You.","O Allah, schenke mir Wohlbefinden in meinem Körper. O Allah, schenke mir Wohlbefinden in meinem Gehör. O Allah, schenke mir Wohlbefinden in meinem Sehen. Es gibt keinen Gott außer Dir.","كان النبي ﷺ يقولها ثلاثاً","The Prophet ﷺ used to say it three times.","Der Prophet ﷺ sagte es dreimal.",3),
D("حَسْبِيَ اللَّهُ لَا إِلَهَ إِلَّا هُوَ، عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ","Hasbiyallahu la ilaha illa hu, 'alayhi tawakkaltu wa huwa rabbul-'arshil-'azim.","Allah is sufficient for me, there is no god but He. In Him I put my trust, and He is Lord of the Mighty Throne.","Allah genügt mir, es gibt keinen Gott außer Ihm. Auf Ihn vertraue ich, und Er ist der Herr des Gewaltigen Thrones.","من قالها سبعاً كفاه الله ما أهمه","Whoever says it seven times, Allah suffices him.","Wer es siebenmal sagt, dem genügt Allah.",7),
D("سُبْحَانَ اللَّهِ وَبِحَمْدِهِ","Subhanallahi wa bi-hamdih.","Glory be to Allah and praise be to Him.","Gepriesen sei Allah und Lob sei Ihm.","حُطت خطاياه وإن كانت مثل زبد البحر","His sins are forgiven even if like sea foam.","Seine Sünden werden vergeben, auch wenn sie wie Meeresschaum sind.",100),
D("أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ","Astaghfirullaha wa atubu ilayh.","I seek Allah's forgiveness and I repent to Him.","Ich bitte Allah um Vergebung und ich kehre zu Ihm zurück.","من استغفر غُفر له","Whoever seeks forgiveness is forgiven.","Wer um Vergebung bittet, dem wird vergeben.",100),
D("لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ","La ilaha illallahu wahdahu la sharika lah, lahul-mulku wa lahul-hamdu wa huwa 'ala kulli shay'in qadir.","There is no god but Allah alone, without partner. To Him belongs dominion and praise, and He is able to do all things.","Es gibt keinen Gott außer Allah allein, ohne Partner. Ihm gehört die Herrschaft und das Lob, und Er ist zu allem fähig.","كانت له حرزاً من الشيطان يومه ذلك","It is a protection from Satan that day.","Es ist an diesem Tag ein Schutz vor Satan.",100),
D("اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى نَبِيِّنَا مُحَمَّدٍ","Allahumma salli wa sallim 'ala nabiyyina Muhammad.","O Allah, send blessings and peace upon our Prophet Muhammad.","O Allah, sende Segen und Frieden auf unseren Propheten Muhammad.","من صلى عليه عشراً أدركته الشفاعة","Whoever sends blessings ten times attains intercession.","Wer zehnmal Segen sendet, erreicht die Fürsprache.",10)

D("أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذِهِ اللَّيْلَةِ وَخَيْرَ مَا بَعْدَهَا، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَذِهِ اللَّيْلَةِ وَشَرِّ مَا بَعْدَهَا","Amsayna wa amsa al-mulku lillah, wal-hamdu lillah, la ilaha illallahu wahdahu la sharika lah, lahul-mulku wa lahul-hamdu wa huwa 'ala kulli shay'in qadir. Rabbi as'aluka khayra ma fi hadhihi al-laylah wa khayra ma ba'daha, wa a'udhu bika min sharri ma fi hadhihi al-laylah wa sharri ma ba'daha.","We have entered the evening and the whole kingdom belongs to Allah. All praise is for Allah. There is no god but Allah alone, without partner. To Him belongs dominion and praise, and He is able to do all things. My Lord, I ask You for the good of this night and the good after it, and I seek refuge in You from the evil of this night and the evil after it.","Wir sind in den Abend eingetreten und das ganze Königreich gehört Allah. Alles Lob gehört Allah. Es gibt keinen Gott außer Allah allein, ohne Partner. Ihm gehört die Herrschaft und das Lob, und Er ist zu allem fähig. Mein Herr, ich bitte Dich um das Gute dieser Nacht und das Gute danach, und ich suche Zuflucht bei Dir vor dem Übel dieser Nacht und dem Übel danach.","كان النبي ﷺ يقوله إذا أمسى","The Prophet ﷺ used to say it in the evening.","Der Prophet ﷺ sagte es am Abend.",1),
D("اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ لَكَ بِذَنْبِي فَاغْفِرْ لِي، فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ","Allahumma anta rabbi, la ilaha illa ant, khalaqtani wa ana 'abduk, wa ana 'ala 'ahdika wa wa'dika ma astata't, a'udhu bika min sharri ma sana't, abu'u laka bi-ni'matika 'alayy, wa abu'u laka bi-dhanbi faghfir li, fa-innahu la yaghfiru adh-dhunuba illa ant.","O Allah, You are my Lord, there is no god but You. You created me and I am Your servant, and I am upon Your covenant and promise as much as I can. I seek refuge in You from the evil of what I have done. I acknowledge Your blessing upon me, and I acknowledge my sin, so forgive me, for none forgives sins except You.","O Allah, Du bist mein Herr, es gibt keinen Gott außer Dir. Du hast mich erschaffen und ich bin Dein Diener, und ich halte Deinen Bund und Dein Versprechen, so gut ich kann. Ich suche Zuflucht bei Dir vor dem Übel dessen, was ich getan habe. Ich erkenne Deine Gunst an mir an, und ich erkenne meine Sünde an, so vergib mir, denn niemand vergibt Sünden außer Dir.","من قالها موقناً بها فمات من ليلته دخل الجنة","Whoever says it with certainty and dies that night enters Paradise.","Wer es mit Überzeugung sagt und in dieser Nacht stirbt, tritt ins Paradies ein.",1),
D("اللَّهُمَّ بِكَ أَمْسَيْنَا، وَبِكَ أَصْبَحْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ الْمَصِيرُ","Allahumma bika amsayna, wa bika asbahna, wa bika nahya, wa bika namut, wa ilayka al-masir.","O Allah, by You we enter the evening, by You we enter the morning, by You we live, by You we die, and to You is the return.","O Allah, durch Dich treten wir in den Abend ein, durch Dich in den Morgen, durch Dich leben wir, durch Dich sterben wir, und zu Dir ist die Rückkehr.","كان النبي ﷺ يقوله إذا أمسى","The Prophet ﷺ used to say it in the evening.","Der Prophet ﷺ sagte es am Abend.",1),
D("أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ","A'udhu bi-kalimatillahit-tammati min sharri ma khalaq.","I seek refuge in the perfect words of Allah from the evil of what He created.","Ich suche Zuflucht bei den vollkommenen Worten Allahs vor dem Übel dessen, was Er erschaffen hat.","من قالها حين يمسي لم تضره شيء","Whoever says it in the evening, nothing will harm him.","Wer es am Abend sagt, dem schadet nichts.",3),
D("بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ","Bismillahilladhi la yadurru ma'a ismihi shay'un fil-ardi wa la fis-sama'i wa huwa as-sami'ul-'alim.","In the name of Allah, with whose name nothing on earth or in heaven can cause harm, and He is the All-Hearing, All-Knowing.","Im Namen Allahs, mit dessen Namen nichts auf der Erde oder im Himmel schaden kann, und Er ist der Allhörende, der Allwissende.","لم تضره فجأة بلاء","No sudden affliction will harm him.","Kein plötzliches Unglück wird ihm schaden.",3),

function down(i){
if(counts[i]>0){
counts[i]--;
document.getElementById("n"+i).innerText=counts[i];
var total=cur[i].count;
var done=total-counts[i];
var pct=Math.round(done/total*100);
document.getElementById("p"+i).style.width=pct+"%";
if(counts[i]==0){
document.getElementById("c"+i).classList.add("done");
document.getElementById("b"+i).innerText=LANG=='ar'?"✓ تم":LANG=='en'?"✓ Done":"✓ Fertig";
}}}
