<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>أذكار</title>
<style>body{font-family:'Traditional Arabic',Arial,serif;background:#FDF6E3;margin:0;padding:14px}h1{text-align:center;color:#2D4A2B}.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button{flex:1;padding:10px;border:0;border-radius:20px;background:#EDE6D6;font-size:17px;min-width:80px}.tabs button.active{background:#2D4A2B;color:#fff}.card{background:#fff;border-radius:14px;padding:14px;margin:12px 0}.card p{font-size:24px;line-height:2}.fadl{background:#FFF8E1;padding:10px;border-radius:10px;font-size:17px;line-height:1.8}.greenBtn{width:100%;padding:14px;border:0;border-radius:14px;background:#2D4A2B;color:#fff;font-size:18px;font-weight:bold;margin-top:10px}.done{opacity:.4}.tasbNum{text-align:center;font-size:40px;color:#2D4A2B;font-weight:bold}</style></head>
<body><h1>أذكار الصباح والمساء</h1>
<div class="tabs"><button id="bS" class="active" onclick="showTab('s')">☀️ الصباح</button><button id="bM" onclick="showTab('m')">🌙 المساء</button><button id="bN" onclick="showTab('n')">🛏️ النوم</button><button id="bP" onclick="showTab('p')">🕌 بعد الصلاة</button><button id="bT" onclick="showTab('t')">📿 المسبحة</button></div>
<div id="list"></div><div id="tasb" style="display:none"></div>
<script>
var S=[
["آية الكرسي",1,"اللَّهُ لَا إِلَهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ","من قالها حين يصبح أُجير من الجن حتى يمسي. رواه الحاكم"],
["الإخلاص",3,"قُلْ هُوَ اللَّهُ أَحَدٌ ۞ اللَّهُ الصَّمَدُ","تكفي من كل شيء. رواه أبو داود"],
["الفلق",3,"قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ","تكفي من كل شيء. رواه أبو داود"],
["الناس",3,"قُلْ أَعُوذُ بِرَبِّ النَّاسِ","ما تعوذ متعوذ بمثلها. رواه مسلم"],
["أصبحنا وأصبح الملك لله",1,"أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ","كان النبي ﷺ يقوله إذا أصبح. رواه مسلم"],
["سيد الاستغفار",1,"اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ","من قالها موقناً بها فمات من يومه دخل الجنة. رواه البخاري"],
["بسم الله الذي لا يضر",3,"بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ","لم تضره فجأة بلاء. رواه أبو داود"],
["سبحان الله وبحمده",100,"سُبْحَانَ اللَّهِ وَبِحَمْدِهِ","حُطت خطاياه وإن كانت مثل زبد البحر. متفق عليه"]
];
var M=[
["آية الكرسي",1,"اللَّهُ لَا إِلَهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ","من قالها حين يمسي أُجير من الجن حتى يصبح. رواه الحاكم"],
["الإخلاص",3,"قُلْ هُوَ اللَّهُ أَحَدٌ","تكفي من كل شيء. رواه أبو داود"],
["الفلق",3,"قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ","تكفي من كل شيء. رواه أبو داود"],
["الناس",3,"قُلْ أَعُوذُ بِرَبِّ النَّاسِ","ما تعوذ متعوذ بمثلها. رواه مسلم"],
["أمسينا وأمسى الملك لله",1,"أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ","كان النبي ﷺ يقوله إذا أمسى. رواه مسلم"],
["سيد الاستغفار",1,"اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ","من قالها موقناً بها فمات من ليلته دخل الجنة. رواه البخاري"],
["أعوذ بكلمات الله التامات",3,"أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ","من قالها حين يمسي لم تضره شيء. رواه مسلم"],
["سبحان الله وبحمده",100,"سُبْحَانَ اللَّهِ وَبِحَمْدِهِ","حُطت خطاياه. متفق عليه"]
];
var N=[
["آية الكرسي",1,"اللَّهُ لَا إِلَهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ","من قرأها عند النوم لم يزل عليه من الله حافظ. رواه البخاري"],
["الإخلاص والفلق والناس",3,"قُلْ هُوَ اللَّهُ أَحَدٌ، قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ، قُلْ أَعُوذُ بِرَبِّ النَّاسِ","كان النبي ﷺ يجمع كفيه ويمسح بهما جسده. رواه البخاري"],
["باسمك اللهم أموت وأحيا",1,"بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا","كان النبي ﷺ يقوله إذا أراد أن ينام. رواه البخاري"],
["التسبيح قبل النوم",1,"سُبْحَانَ اللَّهِ 33، الْحَمْدُ لِلَّهِ 33، اللَّهُ أَكْبَرُ 34","خير من خادم. متفق عليه"]
];
var P=[
["أستغفر الله",1,"أَسْتَغْفِرُ اللَّهَ 3، اللَّهُمَّ أَنْتَ السَّلَامُ","كان النبي ﷺ يقوله إذا انصرف من صلاته. رواه مسلم"],
["آية الكرسي",1,"اللَّهُ لَا إِلَهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ","من قرأها دبر كل صلاة لم يمنعه من دخول الجنة إلا أن يموت. رواه النسائي"],
["التسبيح بعد الصلاة",1,"سُبْحَانَ اللَّهِ 33، الْحَمْدُ لِلَّهِ 33، اللَّهُ أَكْبَرُ 33","غُفرت خطاياه. رواه مسلم"],
["اللهم لا مانع لما أعطيت",1,"اللَّهُمَّ لَا مَانِعَ لِمَا أَعْطَيْتَ","كان النبي ﷺ يقوله دبر كل صلاة. متفق عليه"]
];
var cur=S,counts=[];
function render(){var L=document.getElementById("list");L.innerHTML="";counts=[];for(var i=0;i<cur.length;i++){counts[i]=cur[i][1];var d=document.createElement("div");d.className="card";d.id="c"+i;d.innerHTML="<h3>"+cur[i][0]+"</h3><p>"+cur[i][2]+"</p><div class='fadl'>⭐ "+cur[i][3]+"</div><div style='text-align:center;font-size:24px;color:#2D4A2B;font-weight:bold;margin-top:8px' id='n"+i+"'>"+cur[i][1]+"</div><button class='greenBtn' id='b"+i+"' onclick='down("+i+")'>✓ اضغط هنا</button>";L.appendChild(d);}}
function down(i){if(counts[i]>0){counts[i]--;document.getElementById("n"+i).innerText=counts[i];if(counts[i]==0){document.getElementById("c"+i).classList.add("done");document.getElementById("b"+i).innerText="✓ تم";}}}
var T=[{n:"سبحان الله",v:0},{n:"الحمد لله",v:0},{n:"الله أكبر",v:0},{n:"استغفر الله",v:0}];
try{var saved=JSON.parse(localStorage.getItem("T")||"null");if(saved&&saved.length)T=saved;}catch(e){}
function renderT(){var e=document.getElementById("tasb");var h="<h2 style='text-align:center'>📿 المسبحة</h2>";for(var i=0;i<T.length;i++){h+="<div class='card'><div style='text-align:center;font-weight:bold;font-size:20px'>"+T[i].n+"</div><div class='tasbNum'>"+T[i].v+"</div><div style='display:flex;gap:8px'><button class='greenBtn' style='margin:0' onclick='tup("+i+")'>+ سبّح</button><button style='padding:14px;border:0;border-radius:14px' onclick='tdown("+i+")'>-</button></div></div>";}h+="<button class='greenBtn' onclick='tadd()'>+ إضافة عداد</button>";e.innerHTML=h;}
function tup(i){T[i].v++;save();renderT();}
function tdown(i){T[i].v=Math.max(0,T[i].v-1);save();renderT();}
function tadd(){var n=prompt("اسم الذكر؟","ذكر جديد");if(n){T.push({n:n,v:0});save();renderT();}}
function save(){try{localStorage.setItem("T",JSON.stringify(T));}catch(e){}}
function showTab(t){document.getElementById("bS").className=t=="s"?"active":"";document.getElementById("bM").className=t=="m"?"active":"";document.getElementById("bN").className=t=="n"?"active":"";document.getElementById("bP").className=t=="p"?"active":"";document.getElementById("bT").className=t=="t"?"active":"";if(t=="t"){document.getElementById("list").style.display="none";document.getElementById("tasb").style.display="block";renderT();}else{document.getElementById("list").style.display="block";document.getElementById("tasb").style.display="none";cur=t=="s"?S:t=="m"?M:t=="n"?N:P;render();}}
render();
</script></body></html>
